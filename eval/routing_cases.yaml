# Routing benchmark for `sfetl bench` (src/sfetl/ask/bench.py).
#
# The model's job in this assistant is to ROUTE a question to one of the prepared intents, or
# to say that none fits. Each case states what must happen:
#   expect: intent    -> `intent` (or one of `also_ok`, genuine overlaps) must be chosen;
#                        `params` lists values that must be extracted (checked separately)
#   expect: free_sql  -> no intent fits but the curated views can answer: the classifier must
#                        return null AND the fallback must write SQL that passes the guardrails
#   expect: decline   -> not answerable from this database (or asks to change it): no intent
#                        and no query that passes the guardrails
# `previous` is the previous question of the same conversation (follow-ups).
#
# Synthetic cases written for this rebuild (English and Spanish), not questions from real users.

- id: r01
  lang: en
  question: What was Iberdrola's revenue in 2024?
  expect: intent
  intent: company_metric
  also_ok: [company_key_figures]
  params: {company: Iberdrola, year: "2024"}

