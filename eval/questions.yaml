# Evaluation set for `sfetl eval`.
# Each reference query returns the minimal answer (a value, or the company names). A generated
# query may return extra columns; see src/sfetl/ask/evaluate.py for the matching rule.
# `ordered: true` when the order of the rows is part of the answer (rankings).

- id: q01
  lang: en
  question: What was Iberdrola's revenue in fiscal year 2024?
  reference_sql: |
    SELECT revenue FROM company_year
    WHERE company_name ILIKE '%iberdrola%' AND fiscal_year = 2024

- id: q02
  lang: en
  question: Which 5 companies had the highest revenue in 2024?
  ordered: true
  reference_sql: |
    SELECT company_name FROM company_year
    WHERE fiscal_year = 2024 AND revenue IS NOT NULL
    ORDER BY revenue DESC LIMIT 5

- id: q03
  lang: en
  question: How many companies are in the database?
  reference_sql: |
    SELECT count(*) FROM company

- id: q04
  lang: en
  question: How many of the companies are banks or insurers?
  reference_sql: |
    SELECT count(*) FROM company WHERE is_financial

- id: q05
  lang: en
  question: What were Banco Santander's total assets at the end of fiscal year 2024?
  reference_sql: |
    SELECT total_assets FROM company_year
    WHERE company_name ILIKE '%santander s.a.%' AND fiscal_year = 2024

- id: q06
  lang: en
  question: Which company had the highest net margin in 2024?
  reference_sql: |
    SELECT company_name FROM company_year_ratios
    WHERE fiscal_year = 2024 AND net_margin IS NOT NULL
    ORDER BY net_margin DESC LIMIT 1

- id: q07
  lang: en
  question: List the companies with negative total equity in fiscal year 2024.
  reference_sql: |
    SELECT company_name FROM company_year
    WHERE fiscal_year = 2024 AND total_equity < 0

- id: q08
  lang: en
  question: What was the aggregate net margin of non-financial companies in 2024?
  reference_sql: |
    SELECT net_margin FROM year_aggregate_ratios
    WHERE fiscal_year = 2024 AND NOT is_financial

- id: q09
  lang: en
  question: What was Telefonica's operating margin in 2023?
  reference_sql: |
    SELECT operating_margin FROM company_year_ratios
    WHERE company_name ILIKE '%telefonica%' AND fiscal_year = 2023

- id: q10
  lang: en
  question: Which companies had a current ratio below 1 in 2024?
  reference_sql: |
    SELECT company_name FROM company_year_ratios
    WHERE fiscal_year = 2024 AND current_ratio < 1

- id: q11
  lang: en
  question: How many validation issues with severity 'error' are there?
  reference_sql: |
    SELECT count(*) FROM validation_issue WHERE severity = 'error'

- id: q12
  lang: en
  question: Which companies have a balance identity validation issue for fiscal year 2024?
  reference_sql: |
    SELECT DISTINCT c.name FROM validation_issue v JOIN company c ON c.lei = v.lei
    WHERE v.rule = 'balance_identity' AND v.fiscal_year = 2024

- id: q13
  lang: en
  question: What was the combined revenue of all non-financial companies in fiscal year 2023?
  reference_sql: |
    SELECT sum(revenue) FROM company_year
    WHERE fiscal_year = 2023 AND NOT is_financial

- id: q14
  lang: en
  question: Which company had the largest increase in revenue from 2023 to 2024, in euros?
  reference_sql: |
    SELECT a.company_name FROM company_year a
    JOIN company_year b ON b.lei = a.lei AND b.fiscal_year = 2023
    WHERE a.fiscal_year = 2024 AND a.revenue IS NOT NULL AND b.revenue IS NOT NULL
    ORDER BY a.revenue - b.revenue DESC LIMIT 1

- id: q15
  lang: en
  question: What is Inditex's equity ratio for fiscal year 2024?
  reference_sql: |
    SELECT equity_ratio FROM company_year_ratios
    WHERE company_name ILIKE '%dise%o textil%' AND fiscal_year = 2024

- id: q16
  lang: en
  question: Show Amadeus's revenue for 2023 and 2024.
  reference_sql: |
    SELECT fiscal_year, revenue FROM company_year
    WHERE company_name ILIKE '%amadeus%' AND fiscal_year IN (2023, 2024)

- id: q17
  lang: es
  question: ¿Cuántas empresas presentaron cuentas del ejercicio 2024?
  reference_sql: |
    SELECT count(DISTINCT lei) FROM filing WHERE fiscal_year = 2024

- id: q18
  lang: es
  question: ¿Cuál fue el beneficio neto de Endesa en 2024?
  reference_sql: |
    SELECT net_profit FROM company_year
    WHERE company_name ILIKE '%endesa%' AND fiscal_year = 2024

- id: q19
  lang: es
  question: ¿Qué cinco empresas tuvieron más activos totales en 2024?
  ordered: true
  reference_sql: |
    SELECT company_name FROM company_year
    WHERE fiscal_year = 2024 AND total_assets IS NOT NULL
    ORDER BY total_assets DESC LIMIT 5

- id: q20
  lang: es
  question: ¿Cuál fue el margen operativo agregado de las empresas no financieras en 2023?
  reference_sql: |
    SELECT operating_margin FROM year_aggregate_ratios
    WHERE fiscal_year = 2023 AND NOT is_financial

- id: q21
  lang: es
  question: ¿Cuánto efectivo y equivalentes tenía Repsol al cierre de 2024?
  reference_sql: |
    SELECT cash FROM company_year
    WHERE company_name ILIKE '%repsol%' AND fiscal_year = 2024

- id: q22
  lang: es
  question: ¿Qué empresa tuvo las mayores pérdidas netas en 2023?
  reference_sql: |
    SELECT company_name FROM company_year
    WHERE fiscal_year = 2023 AND net_profit IS NOT NULL
    ORDER BY net_profit ASC LIMIT 1

- id: q23
  lang: es
  question: ¿Cuántas empresas no financieras tuvieron un margen neto superior al 10 % en 2024?
  reference_sql: |
    SELECT count(*) FROM company_year_ratios
    WHERE fiscal_year = 2024 AND NOT is_financial AND net_margin > 0.10

- id: q24
  lang: es
  question: ¿Qué empresas tienen un ejercicio fiscal que no termina el 31 de diciembre?
  reference_sql: |
    SELECT DISTINCT c.name FROM filing f JOIN company c ON c.lei = f.lei
    WHERE to_char(f.period_end, 'MM-DD') <> '12-31'

- id: q25
  lang: es
  question: ¿Cuál fue el ratio agregado de patrimonio neto sobre activos de bancos y aseguradoras en 2024?
  reference_sql: |
    SELECT equity_ratio FROM year_aggregate_ratios
    WHERE fiscal_year = 2024 AND is_financial

- id: q26
  lang: es
  question: ¿Qué empresas informaron ingresos en 2024 pero no resultado de explotación?
  reference_sql: |
    SELECT company_name FROM company_year
    WHERE fiscal_year = 2024 AND revenue IS NOT NULL AND operating_profit IS NULL
