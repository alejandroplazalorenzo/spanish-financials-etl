name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # unit tests only: offline, fixtures in tests/fixtures, the LLM is scripted
      - run: pytest -m "not integration"

  integration-and-smoke:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sfetl
          POSTGRES_USER: sfetl_owner
          POSTGRES_PASSWORD: ci-only-owner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sfetl_owner -d sfetl"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: sfetl
      POSTGRES_USER: sfetl_owner
      POSTGRES_PASSWORD: ci-only-owner
      SFETL_READER_PASSWORD: ci-only-reader
      SFETL_ASSISTANT_PASSWORD: ci-only-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      # pg_dump/pg_restore 16 for the backup-and-restore round trip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16
      - run: sfetl migrate
      # migrations, loading, roles and RLS, the assistant with a scripted model, backup/restore,
      # and the smoke test: every intent and every assistant write AS sfetl_assistant
      - run: pytest -m integration -ra
