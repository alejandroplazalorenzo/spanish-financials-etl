services:
  db:
    image: postgres:16
    container_name: sfetl-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sfetl}
      POSTGRES_USER: ${POSTGRES_USER:-sfetl_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - sfetl_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  sfetl_pgdata:
